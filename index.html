<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Yune - Sistema en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .bola-historial { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .mini-cell { width: 14px; height: 14px; background-color: #1e293b; border-radius: 2px; }
        .mini-cell.active { background-color: #f43f5e; box-shadow: 0 0 4px #f43f5e; }
        .winning-pattern-cell { background-color: #ec4899 !important; color: white !important; border: 2px solid #facc15 !important; }
        .cell-pattern-target { background-color: rgba(236, 72, 153, 0.3); border: 1px dashed #ec4899; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Contenedor Principal de la App (Aquí se integran tus vistas de Admin y Jugadora) -->
    <div id="app-container" class="flex-1 flex flex-col">
        <!-- Las vistas de login, admin y jugadora operan dinámicamente sobre este contenedor -->
    </div>

    <script>
        // Configuración de Firebase y variables globales de control
        const firebaseConfig = {
            databaseURL: "https://bingo-yune-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let drawnBalls = [];
        let marketCards = {};
        let cardPrice = 300;
        let gamePattern = 'line';
        let isRoomLocked = false;
        let rondasDelDia = JSON.parse(localStorage.getItem('bingo_rondas_dia')) || [];
        let currentUser = { name: '', control: '' };
        let isAutoRunning = false;
        let autoDrawInterval = null;
        let lastSpokenBallCount = 0;
        let hasSpokenMyBingo = false;

        const nombresPatrones = {
            'line': 'Línea Horizontal',
            'letter_l': 'Letra L',
            'cross_x': 'Cruz / X',
            'four_corners': 'Cuatro Esquinas',
            'diagonal': 'Diagonal Principal',
            'small_cross': 'Cruz Pequeña',
            'letter_o': 'Letra O (Marco)',
            'full_card': 'Cartón Lleno',
            'church': 'La Iglesia',
            'letter_t': 'Letra T',
            'letter_h': 'Letra H',
            'anchor': 'El Ancla',
            'plane': 'El Avión',
            'rombo': 'El Rombo'
        };

        function obtenerClaseBolaColor(num) {
            if (num <= 15) return 'bg-red-600 text-white';
            if (num <= 30) return 'bg-amber-500 text-slate-950';
            if (num <= 45) return 'bg-yellow-400 text-slate-950';
            if (num <= 60) return 'bg-emerald-600 text-white';
            return 'bg-pink-600 text-white';
        }

        function cantarTextoVoz(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function obtenerLetraYNumeroVoz(num) {
            let letra = '';
            if (num <= 15) letra = 'B';
            else if (num <= 30) letra = 'I';
            else if (num <= 45) letra = 'N';
            else if (num <= 60) letra = 'G';
            else letra = 'O';
            return `${letra}, ${num}`;
        }

        function esCeldaDelPatron(r, c, patron) {
            let idx = r * 5 + c;
            let indices = [];
            if (patron === 'line') indices = [0, 1, 2, 3, 4];
            else if (patron === 'letter_l') indices = [0, 5, 10, 15, 20, 21, 22, 23, 24];
            else if (patron === 'cross_x') indices = [0, 4, 6, 8, 12, 16, 18, 20, 24];
            else if (patron === 'four_corners') indices = [0, 4, 20, 24];
            else if (patron === 'diagonal') indices = [0, 6, 12, 18, 24];
            else if (patron === 'small_cross') indices = [2, 7, 10, 11, 12, 13, 14, 17, 22];
            else if (patron === 'letter_o') indices = [0, 1, 2, 3, 4, 5, 9, 10, 14, 15, 19, 20, 21, 22, 23, 24];
            else if (patron === 'full_card') indices = Array.from({length: 25}, (_, i) => i);
            else if (patron === 'church') indices = [1, 3, 7, 2, 12, 17, 22];
            else if (patron === 'letter_t') indices = [0, 1, 2, 3, 4, 7, 12, 17, 22];
            else if (patron === 'letter_h') indices = [0, 5, 10, 15, 20, 4, 9, 14, 19, 24, 11, 12, 13];
            else if (patron === 'anchor') indices = [2, 7, 12, 17, 22, 20, 21, 23, 24, 15, 19];
            else if (patron === 'plane') indices = [2, 7, 12, 17, 22, 10, 11, 13, 14, 6, 8];
            else if (patron === 'rombo') indices = [6, 8, 10, 14, 16, 18];
            else indices = [0, 1, 2, 3, 4];
            return indices.includes(idx);
        }

        function verificarFiguraGanadora(grid, balotas, patron) {
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (esCeldaDelPatron(r, c, patron)) {
                        let num = grid[r][c];
                        if (num !== 0 && !balotas.includes(num)) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function obtenerNumerosFaltantesGanar(grid, balotas, patron) {
            let faltantes = [];
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (esCeldaDelPatron(r, c, patron)) {
                        let num = grid[r][c];
                        if (num !== 0 && !balotas.includes(num)) {
                            faltantes.push(num);
                        }
                    }
                }
            }
            return { count: faltantes.length, faltantes: faltantes };
        }

        function generarEstructuraCarton() {
            let grid = [];
            let colRanges = [
                {min: 1, max: 15},
                {min: 16, max: 30},
                {min: 31, max: 45},
                {min: 46, max: 60},
                {min: 61, max: 75}
            ];
            for (let r = 0; r < 5; r++) {
                let row = [];
                for (let c = 0; c < 5; c++) {
                    if (r === 2 && c === 2) {
                        row.push(0); // Casilla central estrella
                    } else {
                        let range = colRanges[c];
                        let num;
                        do {
                            num = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                        } while (row.includes(num));
                        row.push(num);
                    }
                }
                grid.push(row);
            }
            return grid;
        }

        // --- MÓDULO DE SINCRONIZACIÓN Y TIEMPO REAL ---
        function sincronizarDatosAdmin() {
            db.ref('room').on('value', (snapshot) => {
                let data = snapshot.val();
                if (!data) return;

                drawnBalls = data.drawnBalls || [];
                gamePattern = data.gamePattern || 'line';
                marketCards = data.marketCards || {};
                cardPrice = data.cardPrice || 300;
                isRoomLocked = data.isRoomLocked || false;

                let selectPattern = document.getElementById('game-pattern-select');
                if (selectPattern) selectPattern.value = gamePattern;

                let roomCodeInput = document.getElementById('admin-room-code');
                if (roomCodeInput && data.roomCode && !roomCodeInput.value) {
                    roomCodeInput.value = data.roomCode;
                }

                let priceInput = document.getElementById('admin-card-price-input');
                if (priceInput && document.activeElement !== priceInput) {
                    priceInput.value = cardPrice;
                }

                if (drawnBalls.length === 0) {
                    let alertBox = document.getElementById('admin-winner-alert');
                    if (alertBox) alertBox.classList.add('hidden');
                    lastSpokenBallCount = 0;
                } else {
                    if (drawnBalls.length > lastSpokenBallCount) {
                        let ultima = drawnBalls[drawnBalls.length - 1];
                        cantarTextoVoz(obtenerLetraYNumeroVoz(ultima));
                        lastSpokenBallCount = drawnBalls.length;
                    }
                }

                let currentBallEl = document.getElementById('admin-current-ball');
                if (currentBallEl) {
                    if (drawnBalls.length > 0) {
                        let ultima = drawnBalls[drawnBalls.length - 1];
                        currentBallEl.innerText = ultima;
                        currentBallEl.className = `w-28 h-28 rounded-full font-extrabold text-5xl flex items-center justify-center shadow-lg ${obtenerClaseBolaColor(ultima)}`;
                    } else {
                        currentBallEl.innerText = "--";
                        currentBallEl.className = "w-28 h-28 rounded-full bg-yellow-400 text-slate-950 font-extrabold text-5xl flex items-center justify-center shadow-lg";
                    }
                }

                renderizarHistorialAdmin();
                renderizarTableroAdmin();
                renderizarResumenCartonesAdmin();
                renderizarVentanaCartonesPagadosAdmin();
                renderizarAdminWallets();
                renderizarSelectLiberarAdmin();
                renderizarRadarAdmin();
                renderizarJugadorasConectadasAdmin(data.connectedPlayers || {});
                actualizarPreviewWhatsApp();
                verificarGanadoresEnVivoAdmin();
            });
        }

        function sincronizarDatosJugadora() {
            db.ref('room').on('value', (snapshot) => {
                let data = snapshot.val();
                if (!data) return;

                drawnBalls = data.drawnBalls || [];
                gamePattern = data.gamePattern || 'line';
                marketCards = data.marketCards || {};
                cardPrice = data.cardPrice || 300;

                if (data.isRoomLocked) {
                    alert("🔒 La administradora ha cerrado la sala. Cerrando sesión por seguridad.");
                    if (typeof backToHome === 'function') backToHome();
                    return;
                }

                let btnCargar = document.getElementById('btn-cargar-cartones');
                if (btnCargar) btnCargar.innerText = `📥 Cargar / Confirmar Mis Cartones ($${cardPrice.toLocaleString()} c/u)`;

                if (drawnBalls.length === 0) {
                    hasSpokenMyBingo = false;
                    let winNotif = document.getElementById('player-winner-notification');
                    if (winNotif) winNotif.classList.add('hidden');
                } else {
                    if (drawnBalls.length > lastSpokenBallCount) {
                        let ultima = drawnBalls[drawnBalls.length - 1];
                        cantarTextoVoz(obtenerLetraYNumeroVoz(ultima));
                        lastSpokenBallCount = drawnBalls.length;
                    }
                }

                let patternLabel = document.getElementById('player-pattern-label');
                if (patternLabel) patternLabel.innerText = nombresPatrones[gamePattern] || 'Línea';
                actualizarMiniDiagramaPatron(gamePattern);

                let currentBallEl = document.getElementById('player-current-ball');
                if (currentBallEl) {
                    if (drawnBalls.length > 0) {
                        let ultima = drawnBalls[drawnBalls.length - 1];
                        currentBallEl.innerText = ultima;
                        currentBallEl.className = `w-24 h-24 rounded-full font-extrabold text-4xl flex items-center justify-center shadow-lg animate-pulse ${obtenerClaseBolaColor(ultima)}`;
                    } else {
                        currentBallEl.innerText = "--";
                        currentBallEl.className = "w-24 h-24 rounded-full bg-yellow-400 text-slate-950 font-extrabold text-4xl flex items-center justify-center shadow-lg animate-pulse";
                    }
                }

                renderizarHistorialJugadora();
                renderizarTableroJugadora();
                renderizarMercadoJugadora();
                renderizarMisCartones();
                renderizarJugadorasConectadasJugadora(data.connectedPlayers || {});
            });

            if (currentUser && currentUser.control) {
                db.ref(`users/${currentUser.control}`).on('value', (snap) => {
                    let userData = snap.val();
                    if (!userData) {
                        alert("⚠️ Has sido eliminada del sistema por la Administradora.");
                        if (typeof backToHome === 'function') backToHome();
                        return;
                    }

                    let balance = userData.balance || 0;
                    let isCredit = userData.isCredit || false;

                    let balanceEl = document.getElementById('wallet-balance-display');
                    let labelEl = document.getElementById('wallet-label');
                    if (balanceEl) balanceEl.innerText = balance.toLocaleString();
                    if (labelEl) {
                        if (isCredit) {
                            labelEl.innerText = "Crédito Exclusivo 🌟";
                            balanceEl.className = "text-lg font-black text-amber-400";
                        } else {
                            labelEl.innerText = "Mi Saldo";
                            balanceEl.className = "text-lg font-black text-emerald-400";
                        }
                    }
                });
            }
        }

        // --- FUNCIONES DE WHATSAPP ---
        function generarTextoResumenWhatsApp() {
            let jugadorasMap = {};
            let totalCartones = 0;

            for (let id in marketCards) {
                let card = marketCards[id];
                if (card.owner && card.ownerControl && card.loaded) {
                    totalCartones++;
                    if (!jugadorasMap[card.ownerControl]) {
                        jugadorasMap[card.ownerControl] = { name: card.owner, cards: [] };
                    }
                    jugadorasMap[card.ownerControl].cards.push(card.id);
                }
            }

            let fechaHoy = new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            let texto = `🎲 *LISTA DE CARTONES EN JUEGO - BINGO YUNE* 🎲\n📅 Fecha: ${fechaHoy}\n\n`;

            let controls = Object.keys(jugadorasMap);
            if (controls.length === 0) {
                return "Aún no hay cartones cargados en juego para esta ronda.";
            }

            controls.forEach(ctrl => {
                let j = jugadorasMap[ctrl];
                j.cards.sort((a, b) => a - b);
                texto += `👤 *${j.name}*\n   Cartones: #${j.cards.join(', #')}\n\n`;
            });

            texto += `🎟️ *Total de cartones:* ${totalCartones}\n`;
            texto += `💰 *Valor por cartón:* $${cardPrice}\n`;
            texto += `✨ ¡Mucha suerte a todas en la partida! ✨`;

            return texto;
        }

        function actualizarPreviewWhatsApp() {
            let textarea = document.getElementById('texto-whatsapp-preview');
            if (textarea) {
                textarea.value = generarTextoResumenWhatsApp();
            }
        }

        function copiarResumenWhatsApp() {
            let textoFinal = generarTextoResumenWhatsApp();
            navigator.clipboard.writeText(textoFinal).then(() => {
                alert("📋 ¡Lista copiada con éxito! Ya puedes ir al grupo de WhatsApp y pegarla.");
            }).catch(err => {
                let textarea = document.getElementById('texto-whatsapp-preview');
                if (textarea) {
                    textarea.select();
                    document.execCommand('copy');
                }
                alert("📋 ¡Lista copiada al portapapeles!");
            });
        }

        // --- CONTROL DE RONDAS Y GANANCIAS ---
        function registrarRondaManual() {
            let totalCartonesRonda = 0;
            for (let id in marketCards) {
                if (marketCards[id].owner && marketCards[id].loaded) {
                    totalCartonesRonda++;
                }
            }

            if (totalCartonesRonda === 0) {
                alert("⚠️ No hay cartones jugados en esta ronda para registrar.");
                return;
            }

            let recaudadoRonda = totalCartonesRonda * cardPrice;
            let horaActual = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

            let nuevaRonda = {
                numero: rondasDelDia.length + 1,
                hora: horaActual,
                cartones: totalCartonesRonda,
                recaudado: recaudadoRonda,
                figura: nombresPatrones[gamePattern] || 'Línea'
            };

            rondasDelDia.push(nuevaRonda);
            localStorage.setItem('bingo_rondas_dia', JSON.stringify(rondasDelDia));
            renderizarHistorialRondasDia();
            alert(`✅ ¡Ronda #${nuevaRonda.numero} registrada con éxito! (${totalCartonesRonda} cartones / Recaudado: ${recaudadoRonda.toLocaleString()})`);
        }

        function registrarYReiniciarSiguienteRonda() {
            registrarRondaManual();
            reiniciarBalotasParaSiguienteFigura();
        }

        function renderizarHistorialRondasDia() {
            let container = document.getElementById('lista-rondas-dia-container');
            let badgeRondas = document.getElementById('badge-total-rondas-dia');
            let statRecaudado = document.getElementById('stat-recaudado-hoy');
            let statCartones = document.getElementById('stat-cartones-hoy');
            if (!container) return;

            container.innerHTML = '';
            let totalRecaudadoGlobal = 0;
            let totalCartonesGlobal = 0;

            if (rondasDelDia.length === 0) {
                container.innerHTML = '<span class="text-slate-500 text-center py-2">No hay rondas finalizadas todavía hoy.</span>';
                if (badgeRondas) badgeRondas.innerText = "0 Rondas Realizadas";
                if (statRecaudado) statRecaudado.innerText = "0.00";
                if (statCartones) statCartones.innerText = "0";
                return;
            }

            if (badgeRondas) badgeRondas.innerText = `${rondasDelDia.length} Ronda(s) Realizada(s)`;

            rondasDelDia.forEach(r => {
                totalRecaudadoGlobal += r.recaudado;
                totalCartonesGlobal += r.cartones;

                let div = document.createElement('div');
                div.className = "bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <strong class="text-yellow-400">Ronda #${r.numero}</strong> <span class="text-slate-400 text-[10px]">(${r.hora})</span>
                        <div class="text-slate-300 text-[11px]">Figura: ${r.figura} &bull; ${r.cartones} cartones</div>
                    </div>
                    <div class="text-right">
                        <span class="text-emerald-400 font-bold block">${r.recaudado.toLocaleString()}</span>
                    </div>
                `;
                container.appendChild(div);
            });

            if (statRecaudado) statRecaudado.innerText = totalRecaudadoGlobal.toLocaleString();
            if (statCartones) statCartones.innerText = totalCartonesGlobal;
        }

        function limpiarHistorialRondas() {
            if (confirm("¿Estás segura de reiniciar el registro de rondas y ganancias de hoy?")) {
                rondasDelDia = [];
                localStorage.removeItem('bingo_rondas_dia');
                renderizarHistorialRondasDia();
                alert("🗑️ Historial del día reiniciado a cero.");
            }
        }

        // --- RENDERIZADOS DE HISTORIAL Y TABLEROS ---
        function renderizarHistorialAdmin() {
            let container = document.getElementById('admin-history-balls');
            if (!container) return;
            container.innerHTML = '';
            let ultimas5 = drawnBalls.slice(-5).reverse();
            if (ultimas5.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-500">--</span>';
                return;
            }
            ultimas5.forEach(num => {
                let div = document.createElement('div');
                div.className = `bola-historial ${obtenerClaseBolaColor(num)}`;
                div.innerText = num;
                container.appendChild(div);
            });
        }

        function renderizarHistorialJugadora() {
            let container = document.getElementById('player-history-balls');
            if (!container) return;
            container.innerHTML = '';
            let ultimas5 = drawnBalls.slice(-5).reverse();
            if (ultimas5.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-500">--</span>';
                return;
            }
            ultimas5.forEach(num => {
                let div = document.createElement('div');
                div.className = `bola-historial ${obtenerClaseBolaColor(num)}`;
                div.innerText = num;
                container.appendChild(div);
            });
        }

        function renderizarTableroAdmin() {
            let gridEl = document.getElementById('admin-board-grid');
            if (!gridEl) return;
            gridEl.innerHTML = '';
            for (let i = 1; i <= 75; i++) {
                let div = document.createElement('div');
                let activo = drawnBalls.includes(i);
                div.className = `w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs ${activo ? obtenerClaseBolaColor(i) + ' shadow-md' : 'bg-slate-900 text-slate-500'}`;
                div.innerText = i;
                gridEl.appendChild(div);
            }
        }

        function renderizarTableroJugadora() {
            let gridEl = document.getElementById('player-board-grid');
            if (!gridEl) return;
            gridEl.innerHTML = '';
            for (let i = 1; i <= 75; i++) {
                let div = document.createElement('div');
                let activo = drawnBalls.includes(i);
                div.className = `w-7 h-7 rounded-lg flex items-center justify-center font-bold text-[10px] ${activo ? obtenerClaseBolaColor(i) + ' shadow' : 'bg-slate-900 text-slate-600'}`;
                div.innerText = i;
                gridEl.appendChild(div);
            }
        }

        // --- GESTIÓN DE BILLETERAS Y ADMINISTRACIÓN DE SALDOS ---
        function renderizarVentanaCartonesPagadosAdmin() {
            let container = document.getElementById('admin-paid-cards-window');
            let badgeCount = document.getElementById('admin-paid-count-badge');
            if (!container) return;
            container.innerHTML = '';

            let jugadorasMap = {};
            let totalCartonesPagados = 0;

            for (let id in marketCards) {
                let card = marketCards[id];
                if (card.owner && card.ownerControl && card.paid) {
                    totalCartonesPagados++;
                    if (!jugadorasMap[card.ownerControl]) {
                        jugadorasMap[card.ownerControl] = { name: card.owner, control: card.ownerControl, cards: [] };
                    }
                    jugadorasMap[card.ownerControl].cards.push(card.id);
                }
            }

            if (badgeCount) badgeCount.innerText = `${totalCartonesPagados} cartón(es) pagado(s)`;

            let controls = Object.keys(jugadorasMap);
            if (controls.length === 0) {
                container.innerHTML = '<span class="text-slate-500 text-xs col-span-2 text-center py-4">No hay cartones marcados como "Pagado" todavía.</span>';
                return;
            }

            controls.forEach(ctrl => {
                let j = jugadorasMap[ctrl];
                j.cards.sort((a, b) => a - b);

                let div = document.createElement('div');
                div.className = "bg-slate-950 p-3 rounded-xl flex flex-col gap-1.5 border border-emerald-500/30 text-xs";
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <strong class="text-pink-300 text-sm">${j.name}</strong>
                        <span class="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-slate-400 font-mono">Control: ${j.control}</span>
                    </div>
                    <div class="text-emerald-300 font-bold flex items-center gap-1.5">
                        <span>✅ Cartones en juego:</span> 
                        <span class="tracking-wide">#${j.cards.join(', #')}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderizarAdminWallets() {
            let container = document.getElementById('admin-wallets-list');
            if (!container) return;

            db.ref('users').once('value', (snapshot) => {
                let users = snapshot.val();
                if (!users) {
                    container.innerHTML = '<span class="text-slate-500 text-xs col-span-2 text-center py-4">No hay jugadoras registradas aún.</span>';
                    return;
                }

                container.innerHTML = '';
                Object.keys(users).forEach(code => {
                    let user = users[code];
                    let balance = user.balance || 0;
                    let isCredit = user.isCredit || false;
                    let balanceColor = isCredit ? 'text-amber-400' : 'text-emerald-400';
                    let badgeText = isCredit ? '<span class="text-[9px] bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded border border-amber-800">Crédito Activo 🌟</span>' : '<span class="text-[9px] bg-emerald-950 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-800">Saldo Normal</span>';

                    let div = document.createElement('div');
                    div.className = "bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center gap-2 text-xs";
                    div.innerHTML = `
                        <div>

        function setPositiveBalanceAdmin(code, name) {
            let monto = prompt(`Ingresa el saldo a sumar para ${name} (Control: ${code}):`);
            if (monto !== null && !isNaN(monto)) {
                db.ref(`users/${code}`).once('value', (snap) => {
                    let actual = snap.val() && snap.val().balance ? snap.val().balance : 0;
                    let nuevo = actual + parseFloat(monto);
                    db.ref(`users/${code}`).update({ balance: nuevo });
                    alert(`¡Saldo de ${name} actualizado a ${nuevo.toLocaleString()}!`);
                    renderizarAdminWallets();
                });
            }
        }

        function restarSaldoAdmin(code, name, saldoActual) {
            let montoRetiro = prompt(`¿Cuánto deseas restarle o retirarle a ${name}? (Saldo actual: ${saldoActual.toLocaleString()}):`);
            if (montoRetiro !== null && !isNaN(montoRetiro)) {
                let valorRestar = parseFloat(montoRetiro);
                let nuevoSaldo = saldoActual - valorRestar;
                if (nuevoSaldo < 0) nuevoSaldo = 0;

                db.ref(`users/${code}`).update({ balance: nuevoSaldo });
                alert(`¡Se le han descontado ${valorRestar.toLocaleString()} a ${name}. Su nuevo saldo es ${nuevoSaldo.toLocaleString()}!`);
                renderizarAdminWallets();
            }
        }

        function eliminarJugadorSistema(controlJugadora, nombreJugadora) {
            if (confirm(`¿Estás segura de eliminar por completo a ${nombreJugadora} (Control: ${controlJugadora}) del sistema? Sus cartones serán liberados y su cuenta borrada.`)) {
                for (let id in marketCards) {
                    if (marketCards[id].ownerControl === controlJugadora) {
                        db.ref(`room/marketCards/${id}`).update({ owner: null, ownerControl: null, loaded: false, paid: false });
                    }
                }
                let safeCtrl = controlJugadora.replace(/[.#$\/\[\]]/g, "_");
                db.ref(`room/connectedPlayers/${safeCtrl}`).remove();
                db.ref(`users/${controlJugadora}`).remove();

                let localCtrl = localStorage.getItem('bingo_player_control');
                if (localCtrl === controlJugadora) {
                    localStorage.removeItem('bingo_player_name');
                    localStorage.removeItem('bingo_player_control');
                    localStorage.removeItem('bingo_player_code');
                }

                alert(`¡${nombreJugadora} ha sido eliminada del sistema con éxito!`);
                renderizarAdminWallets();
            }
        }

        function verificarGanadoresEnVivoAdmin() {
            let alertBox = document.getElementById('admin-winner-alert');
            let winnerText = document.getElementById('admin-winner-text');
            if (!alertBox || !winnerText) return;

            let ganadoresEncontrados = [];

            for (let id in marketCards) {
                let card = marketCards[id];
                if (card.owner && card.loaded) {
                    let gano = verificarFiguraGanadora(card.grid, drawnBalls, gamePattern);
                    if (gano) {
                        ganadoresEncontrados.push(card);
                    }
                }
            }

            if (ganadoresEncontrados.length > 0) {
                db.ref('room/premioActual').once('value').then((snap) => {
                    let premioTotal = snap.val() || 0;
                    if (premioTotal > 0) {
                        let cantidadGanadores = ganadoresEncontrados.length;
                        let premioPorPersona = premioTotal / cantidadGanadores;
                        let controlesProcesados = new Set();

                        ganadoresEncontrados.forEach(card => {
                            let ctrlJugadora = card.ownerControl;
                            if (ctrlJugadora && !controlesProcesados.has(ctrlJugadora)) {
                                controlesProcesados.add(ctrlJugadora);
                                db.ref(`users/${ctrlJugadora}`).once('value').then((userSnap) => {
                                    let userData = userSnap.val() || { balance: 0 };
                                    let saldoActual = userData.balance || 0;
                                    let nuevoBalance = saldoActual + premioPorPersona;
                                    db.ref(`users/${ctrlJugadora}/balance`).set(nuevoBalance);
                                });
                            }
                        });
                    }
                });

                let htmlGanadores = `<div class="text-base text-yellow-300 font-extrabold mb-1">¡Se detectaron ${ganadoresEncontrados.length} ganador(es) simultáneo(s)!</div>`;
                
                ganadoresEncontrados.forEach(card => {
                    htmlGanadores += `
                        <div class="bg-slate-900/90 text-white p-3 rounded-2xl my-1 flex flex-col gap-1.5 border border-yellow-400 text-xs">
                            <span class="font-bold text-yellow-300">Cartón #${card.id} &bull; ${card.owner} (Ctrl: ${card.ownerControl})</span>
                            <div class="grid grid-cols-5 gap-1 max-w-[180px] mx-auto w-full">`;
                    
                    for (let r = 0; r < 5; r++) {
                        for (let c = 0; c < 5; c++) {
                            let num = card.grid[r][c];
                            let marcado = num === 0 || drawnBalls.includes(num);
                            let esFiguraGanadora = esCeldaDelPatron(r, c, gamePattern);
                            let claseColor = marcado ? 'bg-yellow-400 text-slate-950' : 'bg-slate-800 text-slate-300';
                            if (esFiguraGanadora) claseColor = 'winning-pattern-cell';
                            htmlGanadores += `<div class="py-0.5 text-[9px] font-bold text-center rounded ${claseColor}">${num === 0 ? '⭐' : num}</div>`;
                        }
                    }
                    htmlGanadores += `</div></div>`;
                });

                winnerText.innerHTML = htmlGanadores;

                if (alertBox.classList.contains('hidden')) {
                    cantarTextoVoz("¡Bingo! ¡Tenemos cartón ganador en la sala!");
                }
                alertBox.classList.remove('hidden');

                if (isAutoRunning) {
                    clearInterval(autoDrawInterval);
                    isAutoRunning = false;
                    let autoBtn = document.getElementById('auto-draw-btn');
                    if (autoBtn) {
                        autoBtn.innerText = "▶ Iniciar Auto (Cada 3s)";
                        autoBtn.classList.replace('bg-slate-600', 'bg-pink-600');
                    }
                }
            }
        }

        function drawBallManually() {
            for (let id in marketCards) {
                if (marketCards[id].owner && marketCards[id].loaded && verificarFiguraGanadora(marketCards[id].grid, drawnBalls, gamePattern)) {
                    alert("⚠️ ¡Ya hay cartón ganador en esta ronda! El juego está detenido.");
                    return;
                }
            }

            if (drawnBalls.length >= 75) {
                alert("¡Ya salieron todas las balotas!");
                return;
            }
            let disponibles = [];
            for (let i = 1; i <= 75; i++) {
                if (!drawnBalls.includes(i)) disponibles.push(i);
            }
            let nuevaBola = disponibles[Math.floor(Math.random() * disponibles.length)];
            drawnBalls.push(nuevaBola);
            db.ref('room/drawnBalls').set(drawnBalls);
        }

        function toggleAutoDraw() {
            let autoBtn = document.getElementById('auto-draw-btn');
            if (isAutoRunning) {
                clearInterval(autoDrawInterval);
                isAutoRunning = false;
                if (autoBtn) {
                    autoBtn.innerText = "▶ Iniciar Auto (Cada 3s)";
                    autoBtn.classList.replace('bg-pink-600', 'bg-slate-600');
                }
            } else {
                isAutoRunning = true;
                if (autoBtn) {
                    autoBtn.innerText = "⏸ Pausar Auto";
                    autoBtn.classList.replace('bg-slate-600', 'bg-pink-600');
                }
                autoDrawInterval = setInterval(() => {
                    for (let id in marketCards) {
                        if (marketCards[id].owner && marketCards[id].loaded && verificarFiguraGanadora(marketCards[id].grid, drawnBalls, gamePattern)) {
                            clearInterval(autoDrawInterval);
                            isAutoRunning = false;
                            if (autoBtn) {
                                autoBtn.innerText = "▶ Iniciar Auto (Cada 3s)";
                                autoBtn.classList.replace('bg-pink-600', 'bg-slate-600');
                            }
                            return;
                        }
                    }

                    if (drawnBalls.length >= 75) {
                        clearInterval(autoDrawInterval);
                        isAutoRunning = false;
                        if (autoBtn) {
                            autoBtn.innerText = "▶ Iniciar Auto (Cada 3s)";
                            autoBtn.classList.replace('bg-pink-600', 'bg-slate-600');
                        }
                        return;
                    }
                    drawBallManually();
                }, 3000);
            }
        }

        function actualizarMiniDiagramaPatron(patron) {
            let cells = document.querySelectorAll('#mini-diagram-grid .mini-cell');
            if (cells.length === 0) {
                inicializarMiniDiagrama();
                cells = document.querySelectorAll('#mini-diagram-grid .mini-cell');
            }
            if (cells.length === 0) return;

            cells.forEach(c => c.classList.remove('active'));

            let indicesActivos = [];
            if (patron === 'line') indicesActivos = [0, 1, 2, 3, 4];
            else if (patron === 'letter_l') indicesActivos = [0, 5, 10, 15, 20, 21, 22, 23, 24];
            else if (patron === 'cross_x') indicesActivos = [0, 4, 6, 8, 12, 16, 18, 20, 24];
            else if (patron === 'four_corners') indicesActivos = [0, 4, 20, 24];
            else if (patron === 'diagonal') indicesActivos = [0, 6, 12, 18, 24];
            else if (patron === 'small_cross') indicesActivos = [2, 7, 10, 11, 12, 13, 14, 17, 22];
            else if (patron === 'letter_o') indicesActivos = [0, 1, 2, 3, 4, 5, 9, 10, 14, 15, 19, 20, 21, 22, 23, 24];
            else if (patron === 'full_card') indicesActivos = Array.from({length: 25}, (_, i) => i);
            else if (patron === 'church') indicesActivos = [1, 3, 7, 2, 12, 17, 22];
            else if (patron === 'letter_t') indicesActivos = [0, 1, 2, 3, 4, 7, 12, 17, 22];
            else if (patron === 'letter_h') indicesActivos = [0, 5, 10, 15, 20, 4, 9, 14, 19, 24, 11, 12, 13];
            else if (patron === 'anchor') indicesActivos = [2, 7, 12, 17, 22, 20, 21, 23, 24, 15, 19];
            else if (patron === 'plane') indicesActivos = [2, 7, 12, 17, 22, 10, 11, 13, 14, 6, 8];
            else if (patron === 'rombo') indicesActivos = [6, 8, 10, 14, 16, 18];
            else indicesActivos = [0, 1, 2, 3, 4];

            indicesActivos.forEach(idx => {
                if (cells[idx] && idx >= 0 && idx < 25) cells[idx].classList.add('active');
            });
        }

        function abrirVistaPreviaFullscreen(cardId) {
            let card = marketCards[cardId];
            if (!card) return;

            let titleEl = document.getElementById('modal-preview-title');
            if (titleEl) titleEl.innerText = `Cartón #${card.id}`;
            let gridContainer = document.getElementById('modal-preview-grid');
            if (!gridContainer) return;
            gridContainer.innerHTML = '';

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let num = card.grid[r][c];
                    let marcado = num === 0 || drawnBalls.includes(num);
                    let esFigura = esCeldaDelPatron(r, c, gamePattern);
                    
                    let clasesCelda = `py-2.5 text-xs font-bold text-center rounded relative ${marcado ? 'bg-yellow-400 text-slate-950 shadow' : 'bg-slate-800 text-slate-200'} ${esFigura ? 'cell-pattern-target border border-pink-400' : ''}`;
                    gridContainer.innerHTML += `<div class="${clasesCelda}">${num === 0 ? '⭐' : num}</div>`;
                }
            }

            let modal = document.getElementById('modal-carton-fullscreen');
            if (modal) modal.classList.remove('hidden');
        }

        function cerrarVistaPreviaFullscreen() {
            let modal = document.getElementById('modal-carton-fullscreen');
            if (modal) modal.classList.add('hidden');
        }

        function renderizarMercadoJugadora() {
            let container = document.getElementById('cards-market-grid');
            let statusMsg = document.getElementById('market-status-msg');
            let availableCountEl = document.getElementById('available-count');
            if (!container) return;
            container.innerHTML = '';
            let disponiblesCount = 0;
            let juegoIniciado = drawnBalls.length > 0;

            if (statusMsg) {
                if (juegoIniciado) {
                    statusMsg.innerText = "🔒 Partida iniciada: El mercado está cerrado y los cartones en juego no se pueden modificar.";
                } else {
                    statusMsg.innerText = "Toca un cartón para seleccionarlo/quitarlo. Toca el botón 🔍 para inspeccionarlo en pantalla completa.";
                }
            }

            for (let id in marketCards) {
                let card = marketCards[id];
                if (!card.owner) disponiblesCount++;

                let div = document.createElement('div');
                let esMio = card.ownerControl === currentUser.control;
                let estaCargadoMio = esMio && card.loaded;
                
                div.className = `p-2 rounded-xl text-center font-bold text-xs border flex flex-col items-center justify-between gap-1.5 ${estaCargadoMio ? 'bg-pink-600/40 border-pink-500 text-pink-200' : esMio ? 'bg-green-600/30 border-green-500 text-green-300' : card.owner ? 'bg-slate-900 border-slate-800 text-slate-600 opacity-80' : 'bg-slate-800 border-slate-700 text-yellow-300 hover:bg-slate-700'}`;
                
                div.innerHTML = `
                    <span class="cursor-pointer w-full py-1" onclick="seleccionarCarton(${id})">#${id}</span>
                    <button onclick="event.stopPropagation(); abrirVistaPreviaFullscreen(${id})" class="w-full bg-slate-900/80 hover:bg-slate-900 text-slate-300 hover:text-white py-1 rounded text-[10px] flex items-center justify-center gap-1 shadow">🔍 Ver</button>
                `;

                container.appendChild(div);
            }
            if (availableCountEl) availableCountEl.innerText = disponiblesCount;
        }

        function seleccionarCarton(id) {
            let card = marketCards[id];
            let juegoIniciado = drawnBalls.length > 0;

            if (juegoIniciado) {
                alert("⚠️ La partida ya comenzó.");
                return;
            }

            if (card.owner && card.ownerControl !== currentUser.control) {
                alert("Este cartón ya está ocupado por otra jugadora.");
                return;
            }

            if (card.ownerControl === currentUser.control && card.loaded) {
                alert("🔒 Este cartón ya está cargado. Escríbele a Yune para que te lo libere si deseas cambiarlo.");
                return;
            }

            if (card.ownerControl === currentUser.control && !card.loaded) {
                db.ref(`room/marketCards/${id}`).update({ owner: null, ownerControl: null, loaded: false, paid: false });
            } else {
                db.ref(`room/marketCards/${id}`).update({ owner: currentUser.name, ownerControl: currentUser.control, loaded: false, paid: false });
            }
        }

        function cargarMisCartones() {
            let juegoIniciado = drawnBalls.length > 0;
            if (juegoIniciado) {
                alert("⚠️ La partida ya comenzó. No puedes cargar más cartones.");
                return;
            }

            db.ref(`users/${currentUser.control}`).once('value').then((snap) => {
                let userData = snap.val() || { balance: 0, isCredit: false };
                let balance = userData.balance || 0;
                let isCredit = userData.isCredit || false;

                if (!isCredit && balance <= 0) {
                    alert("❌ No puedes cargar cartones porque no tienes saldo positivo ni el crédito habilitado. Comunícate con la administración.");
                    return;
                }

                let cartonesNuevos = 0;
                for (let id in marketCards) {
                    let card = marketCards[id];
                    if (card.ownerControl === currentUser.control && !card.loaded) {
                        cartonesNuevos++;
                    }
                }

                if (cartonesNuevos === 0) {
                    alert("No tienes cartones nuevos seleccionados para cargar.");
                    return;
                }

                let costoTotal = cartonesNuevos * cardPrice;

                if (!isCredit && balance < costoTotal) {
                    alert(`Saldo insuficiente. Necesitas ${costoTotal.toLocaleString()} y tienes ${balance.toLocaleString()}. Comunícate con Yune para recargar.`);
                    return;
                }

                let nuevoSaldo = balance - costoTotal;
                db.ref(`users/${currentUser.control}/balance`).set(nuevoSaldo);

                for (let id in marketCards) {
                    let card = marketCards[id];
                    if (card.ownerControl === currentUser.control && !card.loaded) {
                        db.ref(`room/marketCards/${id}`).update({ loaded: true, paid: true });
                    }
                }

                alert(`¡${cartonesNuevos} cartón(es) cargado(s) con éxito por un valor total de ${costoTotal.toLocaleString()}! Nuevo saldo: ${nuevoSaldo.toLocaleString()}`);
            });
        }

        function renderizarMisCartones() {
            let container = document.getElementById('player-my-cards-container');
            if (!container) return;
            container.innerHTML = '';
            
            let misCartones = [];
            for (let id in marketCards) {
                if (marketCards[id].ownerControl === currentUser.control && marketCards[id].loaded) {
                    let analisis = obtenerNumerosFaltantesGanar(marketCards[id].grid, drawnBalls, gamePattern);
                    misCartones.push({ card: marketCards[id], analisis: analisis });
                }
            }

            if (misCartones.length === 0) {
                container.innerHTML = '<span class="text-slate-500 text-sm col-span-2">Aún no tienes cartones cargados. Selecciona en el mercado y presiona "Cargar".</span>';
                return;
            }

            misCartones.sort((a, b) => a.analisis.count - b.analisis.count);

            misCartones.forEach(item => {
                let card = item.card;
                let analisis = item.analisis;
                let gano = analisis.count === 0;
                let estaAUna = analisis.count === 1;
                
                if (gano && !hasSpokenMyBingo) {
                    hasSpokenMyBingo = true;
                    cantarTextoVoz("¡Bingo! ¡Tu cartón ha ganado!");

                    let pubText = document.getElementById('public-winner-text');
                    let pubTitle = document.getElementById('public-winner-card-title');
                    let publicWinningGrid = document.getElementById('public-winning-card-grid');

                    if (pubText) pubText.innerText = `¡Tu Cartón #${card.id} hizo BINGO!`;
                    if (pubTitle) pubTitle.innerText = `Cartón Ganador #${card.id}`;
                    
                    if (publicWinningGrid) {
                        publicWinningGrid.innerHTML = '';
                        for (let r = 0; r < 5; r++) {
                            for (let c = 0; c < 5; c++) {
                                let num = card.grid[r][c];
                                let marcado = num === 0 || drawnBalls.includes(num);
                                let esFiguraGanadora = esCeldaDelPatron(r, c, gamePattern);
                                let claseColor = marcado ? 'bg-yellow-400 text-slate-950' : 'bg-slate-800 text-slate-300';
                                if (esFiguraGanadora) claseColor = 'winning-pattern-cell';
                                publicWinningGrid.innerHTML += `<div class="py-1 text-[10px] font-bold text-center rounded ${claseColor}">${num === 0 ? '⭐' : num}</div>`;
                            }
                        }
                    }

                    let winNotif = document.getElementById('player-winner-notification');
                    if (winNotif) winNotif.classList.remove('hidden');
                }

                let cardDiv = document.createElement('div');
                let estiloExtra = gano ? 'border-yellow-400 bg-yellow-500/10' : estaAUna ? 'card-one-away bg-pink-500/10' : 'border-slate-700';
                cardDiv.className = `bg-slate-900 border ${estiloExtra} p-3 rounded-2xl flex flex-col gap-2 cursor-pointer hover:border-pink-500 transition`;
                cardDiv.onclick = () => abrirVistaPreviaFullscreen(card.id);

                let htmlGrid = '<div class="grid grid-cols-5 gap-1 text-center">';
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        let num = card.grid[r][c];
                        let marcado = num === 0 || drawnBalls.includes(num);
                        let esFigura = esCeldaDelPatron(r, c, gamePattern);
                        let clasesCasilla = `py-1 text-[10px] font-bold rounded relative ${marcado ? 'bg-yellow-400 text-slate-950' : 'bg-slate-800 text-slate-300'} ${esFigura ? 'cell-pattern-target border border-pink-400' : ''}`;
                        htmlGrid += `<div class="${clasesCasilla}">${num === 0 ? '⭐' : num}</div>`;
                    }
                }
                htmlGrid += '</div>';

                let faltantesStr = analisis.faltantes.map(n => n === 0 ? '⭐' : '#' + n).join(', ');

                cardDiv.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-yellow-300">Cartón #${card.id} ${gano ? '👑 ¡BINGO!' : estaAUna ? '🔥 ¡A UNA BOLITA!' : ''}</span>
                        <span class="text-[10px] text-slate-400">${card.paid ? '💰 Pagado' : '⏳ Por Pagar'}</span>
                    </div>
                    ${htmlGrid}
                    <div class="text-[11px] bg-slate-950 p-2 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div><span class="text-slate-400">Le falta(n):</span> <span class="text-pink-400 font-bold">${analisis.count === 0 ? '¡Listo!' : faltantesStr}</span></div>
                        ${estaAUna ? '<span class="text-[10px] bg-yellow-400 text-slate-950 px-2 py-0.5 rounded-full font-extrabold animate-bounce">⏱️ ¡CANTANDO!</span>' : ''}
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        // --- SISTEMA DE CHAT EN VIVO ---
        function enviarMensajeChatJugadora() {
            let input = document.getElementById('input-mensaje-jugadora');
            if (!input) return;
            let mensajeTexto = input.value.trim();
            if (mensajeTexto === "") return;
            let remitente = currentUser.name || "Jugadora";

            db.ref('chatSala').push({
                nombre: remitente,
                mensaje: mensajeTexto,
                tiempo: Date.now()
            }, function(error) {
                if (!error) input.value = "";
            });
        }

        function enviarMensajeChatAdmin() {
            let input = document.getElementById('input-mensaje-admin');
            if (!input) return;
            let mensajeTexto = input.value.trim();
            if (mensajeTexto === "") return;

            db.ref('chatSala').push({
                nombre: "Administradora ⭐",
                mensaje: mensajeTexto,
                tiempo: Date.now()
            }, function(error) {
                if (!error) input.value = "";
            });
        }

        function escucharChatEnVivo() {
            db.ref('chatSala').on('value', function(snapshot) {
                let cajaChatJugadoras = document.getElementById('caja-chat-jugadoras');
                let cajaChatAdmin = document.getElementById('caja-chat-admin');

                if (!snapshot.exists()) {
                    let mensajeVacio = '<p class="text-slate-500 text-center">¡Sé la primera en escribir en el chat!</p>';
                    if (cajaChatJugadoras) cajaChatJugadoras.innerHTML = mensajeVacio;
                    if (cajaChatAdmin) cajaChatAdmin.innerHTML = mensajeVacio;
                    return;
                }

                let htmlMensajes = "";
                snapshot.forEach(function(childSnapshot) {
                    let data = childSnapshot.val();
                    if (data && data.nombre && data.mensaje) {
                        htmlMensajes += `<div class="bg-slate-950/50 p-2 rounded-lg border border-slate-800"><strong class="text-yellow-400">${data.nombre}:</strong> <span class="text-slate-200">${data.mensaje}</span></div>`;
                    }
                });

                if (cajaChatJugadoras) {
                    cajaChatJugadoras.innerHTML = htmlMensajes;
                    cajaChatJugadoras.scrollTop = cajaChatJugadoras.scrollHeight;
                }
                if (cajaChatAdmin) {
                    cajaChatAdmin.innerHTML = htmlMensajes;
                    cajaChatAdmin.scrollTop = cajaChatAdmin.scrollHeight;
                }
            });
        }
    </script>

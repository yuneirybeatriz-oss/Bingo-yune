<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bingo Lineal Yune</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        button:active { background: #219653; }
        #bola-actual { font-size: 48px; font-weight: bold; color: #e74c3c; margin: 20px 0; background: #fdf2f2; padding: 20px; border-radius: 50px; border: 3px dashed #e74c3c; display: inline-block; width: 120px; height: 120px; line-height: 120px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Panel Admin - Bingo Lineal Yune</h1>
        <p>Control de partida</p>
        
        <div>
            <div id="bola-actual">--</div>
        </div>
        
        <button onclick="sacarBolita()">Sacar Siguiente Bolita</button>
        <button onclick="reiniciarJuego()" style="background: #c0392b;">Reiniciar Juego</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "bingo-lineal-yune"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let boladasDisponibles = Array.from({length: 75}, (_, i) => i + 1);

        window.sacarBolita = async function() {
            if (boladasDisponibles.length === 0) {
                alert("¡Ya se han sacado todas las bolitas!");
                return;
            }
            const index = Math.floor(Math.random() * boladasDisponibles.length);
            const bolita = boladasDisponibles.splice(index, 1)[0];

            document.getElementById("bola-actual").innerText = bolita;

            try {
                await setDoc(doc(db, "partida", "estado"), {
                    ultimaBolita: bolita,
                    timestamp: Date.now()
                }, { merge: true });
            } catch (e) {
                console.error("Error al guardar en Firebase:", e);
            }
        };

        window.reiniciarJuego = async function() {
            if(confirm("¿Seguro que quieres reiniciar el juego?")) {
                boladasDisponibles = Array.from({length: 75}, (_, i) => i + 1);
                document.getElementById("bola-actual").innerText = "--";
                await setDoc(doc(db, "partida", "estado"), {
                    ultimaBolita: 0,
                    timestamp: Date.now()
                }, { merge: true });
            }
        };
    </script>
</body>
</html>
